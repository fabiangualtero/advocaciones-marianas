<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Advocaciones Marianas</title>
  <!-- Tailwind CSS para maquetación -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome para íconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <!-- PapaParse para procesamiento de datos desde Google Sheets -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    .card-img {
      height: 220px;
      object-fit: cover;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

  <header class="bg-indigo-900 text-white py-6 shadow-md">
    <div class="container mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-3xl font-bold">Advocaciones Marianas</h1>
        <p class="text-indigo-200 text-sm">Catálogo e historia de las manifestaciones marianas en el mundo</p>
      </div>
      <div id="total-count" class="bg-indigo-800 px-4 py-2 rounded-lg text-sm font-semibold border border-indigo-700">
        Conectando con Google Sheets...
      </div>
    </div>
  </header>

  <main class="container mx-auto px-4 py-8 flex flex-col lg:flex-row gap-8">
    <aside class="w-full lg:w-1/4 bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-fit sticky top-4">
      <h2 class="text-lg font-bold mb-4 flex items-center gap-2 border-b pb-2">
        <i class="fa-solid fa-filter text-indigo-600"></i> Filtros
      </h2>
      <div class="mb-4">
        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Nombre o Palabra Clave</label>
        <input type="text" id="search-input" placeholder="Ej. Pilar, Guadalupe..." 
               class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
      </div>
      <div class="mb-4">
        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Continente</label>
        <select id="filter-continente" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-white">
          <option value="">Todos los continentes</option>
        </select>
      </div>
      <div class="mb-4">
        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Ubicación (Ciudad / País)</label>
        <select id="filter-ubicacion" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-white">
          <option value="">Todas las ubicaciones</option>
        </select>
      </div>
      <button id="btn-reset" class="w-full mt-2 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 rounded-lg text-sm font-semibold transition">
        Restablecer Filtros
      </button>
    </aside>

    <section class="w-full lg:w-3/4">
      <div id="cards-container" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6"></div>
    </section>
  </main>

  <div id="modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 relative shadow-2xl">
      <button id="modal-close" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-2xl font-bold">&times;</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script>
    const GOOGLE_SHEETS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRyxFSTk-sStm4P0EtMIa56QBBGhbOsDowfS1e7GZ5KwNO55A0Lb41_Y7IV1zxVKOV9fbMaH7z_yjk3/pub?output=csv";

    let datos = [];
    const imageCache = new Map(); // Caché en memoria para optimizar peticiones repetidas

    const cardsContainer = document.getElementById('cards-container');
    const searchInput = document.getElementById('search-input');
    const filterContinente = document.getElementById('filter-continente');
    const filterUbicacion = document.getElementById('filter-ubicacion');
    const btnReset = document.getElementById('btn-reset');
    const totalCount = document.getElementById('total-count');
    const modal = document.getElementById('modal');
    const modalContent = document.getElementById('modal-content');
    const modalClose = document.getElementById('modal-close');

    // Imagen mariana neutra de respaldo cuando no exista registro en Wikipedia
    const fallbackImage = "https://images.unsplash.com/photo-1548625149-fc4a29cf7092?q=80&w=600&auto=format&fit=crop";

    // Consulta asíncrona a la API REST de Wikipedia
    async function fetchWikipediaImage(nombre) {
      // Limpiamos texto entre paréntesis para la consulta (ej. "Virgen de Guadalupe (México)" -> "Virgen de Guadalupe")
      const term = nombre.replace(/\([^)]*\)/g, "").trim();
      
      if (imageCache.has(term)) {
        return imageCache.get(term);
      }

      try {
        const response = await fetch(`https://es.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(term)}`);
        if (response.ok) {
          const data = await response.json();
          if (data.thumbnail && data.thumbnail.source) {
            imageCache.set(term, data.thumbnail.source);
            return data.thumbnail.source;
          }
        }
      } catch (err) {
        console.warn(`No se pudo obtener imagen de Wikipedia para: ${term}`, err);
      }

      imageCache.set(term, fallbackImage);
      return fallbackImage;
    }

    function cargarDatosDesdeGoogleSheets() {
      Papa.parse(GOOGLE_SHEETS_CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          datos = results.data.map(item => ({
            nombre: item["Nombre"] || "",
            anio: item["Año"] || "",
            ubicacion: item["Ciudad y País"] || "",
            continente: item["Continente"] || "",
            tipo: item["Tipo"] || "",
            cobertura: item["Cobertura"] || "",
            descripcion: item["Breve Descripción"] || "",
            estatus: item["Estatus / Aprobación por la Iglesia"] || ""
          })).filter(item => item.nombre !== "");

          populateFilters();
          renderCards(datos);
        },
        error: function(err) {
          console.error("Error al cargar con PapaParse:", err);
          totalCount.textContent = "Error al cargar los datos.";
        }
      });
    }

    function populateFilters() {
      const continentes = [...new Set(datos.map(item => item.continente))].filter(Boolean).sort();
      const ubicaciones = [...new Set(datos.map(item => item.ubicacion))].filter(Boolean).sort();

      filterContinente.innerHTML = '<option value="">Todos los continentes</option>';
      filterUbicacion.innerHTML = '<option value="">Todas las ubicaciones</option>';

      continentes.forEach(c => {
        filterContinente.innerHTML += `<option value="${c}">${c}</option>`;
      });
      ubicaciones.forEach(u => {
        filterUbicacion.innerHTML += `<option value="${u}">${u}</option>`;
      });
    }

    function renderCards(items) {
      cardsContainer.innerHTML = '';
      totalCount.textContent = `Mostrando: ${items.length} advocaciones`;

      if (items.length === 0) {
        cardsContainer.innerHTML = `<p class="col-span-full text-center py-12 text-slate-500">No se encontraron registros.</p>`;
        return;
      }

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition cursor-pointer flex flex-col";
        
        // Creamos un ID único para la etiqueta de imagen
        const imgId = `img-${Math.random().toString(36).substring(2, 9)}`;

        card.innerHTML = `
          <img id="${imgId}" src="${fallbackImage}" alt="${item.nombre}" class="w-full card-img">
          <div class="p-4 flex-1 flex flex-col justify-between">
            <div>
              <span class="text-xs font-bold text-indigo-600 uppercase tracking-wider">${item.continente || 'General'}</span>
              <h3 class="text-lg font-bold text-slate-900 mt-1">${item.nombre}</h3>
              <p class="text-xs text-slate-500 mb-2"><i class="fa-solid fa-location-dot"></i> ${item.ubicacion} (${item.anio})</p>
              <p class="text-sm text-slate-600 line-clamp-2">${item.descripcion}</p>
            </div>
            <button class="mt-4 text-xs font-semibold text-indigo-600 hover:text-indigo-800 text-left">Ver información completa &rarr;</button>
          </div>
        `;

        // Asignamos la imagen traída de Wikipedia dinámicamente
        fetchWikipediaImage(item.nombre).then(src => {
          const imgElement = document.getElementById(imgId);
          if (imgElement) imgElement.src = src;
        });

        card.addEventListener('click', () => openModal(item));
        cardsContainer.appendChild(card);
      });
    }

    async function openModal(item) {
      const imgSrc = await fetchWikipediaImage(item.nombre);
      modalContent.innerHTML = `
        <img src="${imgSrc}" onerror="this.onerror=null; this.src='${fallbackImage}';" alt="${item.nombre}" class="w-full h-64 object-cover rounded-lg mb-4">
        <span class="bg-indigo-100 text-indigo-800 text-xs font-semibold px-2.5 py-0.5 rounded">${item.tipo}</span>
        <h2 class="text-2xl font-bold mt-2 text-slate-900">${item.nombre}</h2>
        <p class="text-sm text-slate-500 mb-4"><i class="fa-solid fa-location-dot"></i> ${item.ubicacion} — Año: ${item.anio}</p>
        
        <div class="space-y-3 text-sm text-slate-700 border-t pt-4">
          <p><strong>Descripción:</strong> ${item.descripcion}</p>
          <p><strong>Estatus / Aprobación:</strong> ${item.estatus}</p>
          <p><strong>Cobertura:</strong> ${item.cobertura}</p>
        </div>
      `;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    modalClose.addEventListener('click', () => {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    });

    function filterData() {
      const search = searchInput.value.toLowerCase();
      const cont = filterContinente.value;
      const ubi = filterUbicacion.value;

      const filtered = datos.filter(item => {
        const matchesSearch = item.nombre.toLowerCase().includes(search) || item.descripcion.toLowerCase().includes(search);
        const matchesCont = cont === '' || item.continente === cont;
        const matchesUbi = ubi === '' || item.ubicacion === ubi;
        return matchesSearch && matchesCont && matchesUbi;
      });

      renderCards(filtered);
    }

    searchInput.addEventListener('input', filterData);
    filterContinente.addEventListener('change', filterData);
    filterUbicacion.addEventListener('change', filterData);

    btnReset.addEventListener('click', () => {
      searchInput.value = '';
      filterContinente.value = '';
      filterUbicacion.value = '';
      renderCards(datos);
    });

    cargarDatosDesdeGoogleSheets();
  </script>
</body>
</html>
